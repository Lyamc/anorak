<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>Anorak Search</title>
    <script>
        // Apply the saved theme before the stylesheet paints (no light flash).
        (function () {
            var t = null;
            try { t = localStorage.getItem('anorak-theme'); } catch (e) {}
            document.documentElement.setAttribute('data-theme', t === 'light' || t === 'dark' ? t : 'system');
        })();
    </script>
    <link rel="stylesheet" href="style.css?v=8">
    <script src="https://unpkg.com/htmx.org@1.9.4/dist/htmx.min.js"></script>
    <script src="https://kit.fontawesome.com/48f6fc2f0a.js" crossorigin="anonymous" async></script>
</head>

<body>
    <div id="container">
        <div class="search-bar">
            <form class="search-form" hx-post="/query/" hx-swap="innerHTML" hx-target="#mainContent" hx-trigger="submit">
                <div class="search">
                    <input type="text" placeholder="search..." id="search_term" name="search_term" autofocus>
                </div>
                <!-- Chosen sources (comma list); empty = every source. -->
                <input type="hidden" name="indexers" id="indexersInput" value="">
            </form>

            <div class="search-dropdown" id="sourcesDropdown">
                <button type="button" class="dropdown-toggle" id="sourcesToggle" aria-haspopup="true" aria-expanded="false" disabled title="Loading sources…">
                    Sources
                    <span class="sources-summary" id="sourcesSummary"></span>
                    <span class="active-dot" id="sourcesDot" hidden></span>
                </button>
                <div class="dropdown-panel sources-panel" id="sourcesPanel" hidden>
                    <div class="sources-head">
                        <span class="sources-title">Search these sources</span>
                        <span class="sources-bulk">
                            <button type="button" class="link-btn" id="sourcesAll">All</button>
                            <button type="button" class="link-btn" id="sourcesNone">None</button>
                        </span>
                    </div>
                    <div class="sources-list" id="sourcesList" role="group" aria-label="Sources"></div>
                    <div class="sources-note" id="sourcesNote" role="status" hidden>
                        <span id="sourcesNoteText"></span>
                        <button type="button" class="toolbar-btn" id="sourcesResearch">Search again</button>
                    </div>
                </div>
            </div>

            <div class="search-dropdown" id="filterDropdown">
                <button type="button" class="dropdown-toggle" id="filterToggle" aria-haspopup="true" aria-expanded="false" disabled>
                    Filter
                    <span class="active-dot" id="filterDot" hidden></span>
                </button>
                <div class="dropdown-panel" id="filterPanel" hidden>
                    <label class="toolbar-field grow">
                        <span>Name contains</span>
                        <input type="text" id="filterName" placeholder="filter title…" autocomplete="off">
                    </label>
                    <label class="toolbar-field grow">
                        <span>Category</span>
                        <select id="filterCategory">
                            <option value="" data-label="All categories">All categories</option>
                            <option value="movies" data-label="Movies">Movies</option>
                            <option value="tv" data-label="TV">TV</option>
                            <option value="anime" data-label="Anime">Anime</option>
                            <option value="music" data-label="Music">Music</option>
                            <option value="books" data-label="Books">Books</option>
                            <option value="games" data-label="Games">Games</option>
                            <option value="software" data-label="Software">Software</option>
                            <option value="xxx" data-label="XXX">XXX</option>
                            <option value="other" data-label="Other">Other</option>
                            <option value="unknown" data-label="Unknown (source gives none)">Unknown (source gives none)</option>
                        </select>
                    </label>
                    <div class="dropdown-grid">
                        <label class="toolbar-field">
                            <span>Min seeds</span>
                            <input type="number" id="filterMinSeeds" min="0" step="1" placeholder="0">
                        </label>
                        <label class="toolbar-field">
                            <span>Min size (MB)</span>
                            <input type="number" id="filterMinSize" min="0" step="1" placeholder="0">
                        </label>
                        <label class="toolbar-field">
                            <span>Max size (MB)</span>
                            <input type="number" id="filterMaxSize" min="0" step="1" placeholder="∞">
                        </label>
                    </div>
                    <button type="button" id="clearFilters" class="toolbar-btn">Clear filters</button>
                </div>
            </div>

            <div class="search-dropdown" id="sortDropdown">
                <button type="button" class="dropdown-toggle" id="sortToggle" aria-haspopup="true" aria-expanded="false" disabled>
                    Sort
                    <span class="active-dot" id="sortDot" hidden></span>
                </button>
                <div class="dropdown-panel sort-panel" id="sortPanel" hidden>
                    <div class="sort-rows" id="sortRows" role="group" aria-label="Sort order"></div>
                    <div class="sort-actions">
                        <button type="button" id="sortAddRow" class="toolbar-btn sort-add" title="Add another sort level" aria-label="Add another sort level">
                            <span class="fa-solid fa-plus" aria-hidden="true"></span> Then by
                        </button>
                        <button type="button" id="clearSort" class="toolbar-btn" title="Reset sort to most seeds">Clear sort</button>
                    </div>
                </div>
            </div>

            <button type="button" class="dropdown-toggle theme-toggle" id="themeToggle" title="Theme: Auto (follows system)" aria-label="Theme: Auto (follows system)">
                <span class="theme-icon" id="themeIcon" aria-hidden="true"><span class="fa-solid fa-circle-half-stroke"></span></span>
                <span id="themeLabel">Auto</span>
            </button>
        </div>
        <div id="mainContent"></div>
    </div>

    <script>
        // Theme toggle: Auto (follow OS) -> Light -> Dark -> Auto.
        (() => {
            const root = document.documentElement;
            const btn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            if (!btn) return;
            const order = ['system', 'light', 'dark'];
            const names = { system: 'Auto', light: 'Light', dark: 'Dark' };
            const icons = { system: 'fa-circle-half-stroke', light: 'fa-sun', dark: 'fa-moon' };
            const current = () => {
                const t = root.getAttribute('data-theme');
                return order.includes(t) ? t : 'system';
            };
            const render = () => {
                const t = current();
                const next = order[(order.indexOf(t) + 1) % order.length];
                label.textContent = names[t];
                // Replace the element so the Font Awesome kit re-renders it.
                icon.innerHTML = `<span class="fa-solid ${icons[t]}"></span>`;
                const desc = `Theme: ${names[t]}${t === 'system' ? ' (follows system)' : ''}. Click for ${names[next]}.`;
                btn.title = desc;
                btn.setAttribute('aria-label', desc);
            };
            btn.addEventListener('click', () => {
                const next = order[(order.indexOf(current()) + 1) % order.length];
                root.setAttribute('data-theme', next);
                try {
                    if (next === 'system') localStorage.removeItem('anorak-theme');
                    else localStorage.setItem('anorak-theme', next);
                } catch (e) {}
                render();
            });
            render();
        })();

        // Sort panel: each level is a segmented field picker (Name, Size,
        // Seeds, Age) plus a direction toggle. State lives here so it
        // survives new searches; the results fragment (query.html) reads it
        // via window.anorakSort and subscribes to changes.
        (() => {
            const rowsEl = document.getElementById('sortRows');
            const addBtn = document.getElementById('sortAddRow');
            const clearBtn = document.getElementById('clearSort');
            if (!rowsEl || !addBtn) return;

            const FIELDS = [
                { key: 'name', label: 'Name', icon: 'fa-font', def: 'asc', asc: 'A–Z', desc: 'Z–A' },
                { key: 'size', label: 'Size', icon: 'fa-weight-hanging', def: 'desc', asc: 'Smallest first', desc: 'Largest first' },
                { key: 'seeders', label: 'Seeds', icon: 'fa-seedling', def: 'desc', asc: 'Fewest seeds first', desc: 'Most seeds first' },
                { key: 'date', label: 'Age', icon: 'fa-clock', def: 'desc', asc: 'Oldest first', desc: 'Newest first' },
            ];
            const byKey = Object.fromEntries(FIELDS.map(f => [f.key, f]));
            const DEFAULT = [{ key: 'seeders', dir: 'desc' }];
            const MAX = FIELDS.length;

            let specs = DEFAULT.map(s => ({ ...s }));
            const listeners = new Set();

            const isDefault = () =>
                specs.length === DEFAULT.length &&
                specs.every((s, i) => s.key === DEFAULT[i].key && s.dir === DEFAULT[i].dir);

            const describe = (key, dir) => byKey[key][dir];

            // Put `key` at level `index`; if a later level already used it,
            // that level takes over the field this level had (no duplicates).
            const assign = (index, key, dir) => {
                const prev = specs[index];
                const dup = specs.findIndex((s, i) => i !== index && s.key === key);
                if (dup !== -1 && prev) specs[dup] = { key: prev.key, dir: prev.dir };
                specs[index] = { key, dir: dir || byKey[key].def };
            };

            const rowEls = [];
            const buildRow = () => {
                const row = document.createElement('div');
                row.className = 'sort-row';
                row.innerHTML = `
                    <span class="sort-row-label"></span>
                    <div class="sort-row-controls">
                        <div class="sort-fields" role="group">
                            ${FIELDS.map(f => `<button type="button" class="sort-field" data-key="${f.key}" aria-label="${f.label}" aria-pressed="false"><span class="fa-solid ${f.icon}" aria-hidden="true"></span></button>`).join('')}
                        </div>
                        <button type="button" class="sort-dir"><span class="sort-dir-icon" aria-hidden="true"></span></button>
                        <button type="button" class="sort-remove"><span class="fa-solid fa-xmark" aria-hidden="true"></span></button>
                    </div>`;
                return row;
            };

            const render = () => {
                while (rowEls.length < specs.length) {
                    const row = buildRow();
                    rowsEl.appendChild(row);
                    rowEls.push(row);
                }
                while (rowEls.length > specs.length) rowEls.pop().remove();

                specs.forEach((spec, i) => {
                    const row = rowEls[i];
                    const level = i + 1;
                    const verb = i === 0 ? 'Sort by' : 'Then by';
                    row.dataset.index = String(i);
                    row.querySelector('.sort-row-label').textContent = verb;
                    row.querySelector('.sort-fields').setAttribute('aria-label', `${verb} (level ${level})`);
                    const usedAbove = new Set(specs.slice(0, i).map(s => s.key));
                    row.querySelectorAll('.sort-field').forEach(btn => {
                        const f = byKey[btn.dataset.key];
                        const active = spec.key === f.key;
                        const used = usedAbove.has(f.key);
                        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
                        btn.classList.toggle('active', active);
                        btn.disabled = used;
                        btn.title = used ? `${f.label} (already used above)` : `${verb} ${f.label}`;
                    });
                    const dirBtn = row.querySelector('.sort-dir');
                    const other = spec.dir === 'asc' ? 'desc' : 'asc';
                    const now = describe(spec.key, spec.dir);
                    dirBtn.dataset.dir = spec.dir;
                    dirBtn.title = `${now} — click for ${describe(spec.key, other)}`;
                    dirBtn.setAttribute('aria-label', `${byKey[spec.key].label}: ${now}, ${spec.dir === 'asc' ? 'ascending' : 'descending'}. Click to reverse.`);
                    const icon = row.querySelector('.sort-dir-icon');
                    const cls = `fa-solid ${spec.dir === 'asc' ? 'fa-arrow-up' : 'fa-arrow-down'}`;
                    if (icon.dataset.cls !== cls) {
                        icon.dataset.cls = cls;
                        icon.innerHTML = `<span class="${cls}"></span>`;
                    }
                    const rm = row.querySelector('.sort-remove');
                    rm.hidden = i === 0;
                    rm.title = 'Remove this sort level';
                    rm.setAttribute('aria-label', `Remove sort level ${level} (${byKey[spec.key].label})`);
                });

                addBtn.disabled = specs.length >= MAX;
                addBtn.title = addBtn.disabled ? 'All fields are already used' : 'Add another sort level';
            };

            const changed = () => {
                render();
                listeners.forEach(fn => { try { fn(); } catch (err) { console.error(err); } });
            };

            rowsEl.addEventListener('click', (e) => {
                const btn = e.target instanceof Element ? e.target.closest('button') : null;
                if (!btn || btn.disabled || !rowsEl.contains(btn)) return;
                const row = btn.closest('.sort-row');
                const i = Number(row?.dataset.index);
                if (!Number.isInteger(i) || !specs[i]) return;
                if (btn.classList.contains('sort-field')) {
                    if (specs[i].key === btn.dataset.key) return;
                    assign(i, btn.dataset.key);
                    changed();
                } else if (btn.classList.contains('sort-dir')) {
                    specs[i].dir = specs[i].dir === 'asc' ? 'desc' : 'asc';
                    changed();
                } else if (btn.classList.contains('sort-remove') && i > 0) {
                    specs.splice(i, 1);
                    changed();
                    // Keep keyboard focus inside the panel.
                    const next = rowEls[i]?.querySelector('.sort-remove') || rowEls[i - 1]?.querySelector('.sort-remove:not([hidden])');
                    (next || addBtn).focus();
                }
            });

            addBtn.addEventListener('click', () => {
                if (specs.length >= MAX) return;
                const used = new Set(specs.map(s => s.key));
                const f = FIELDS.find(x => !used.has(x.key));
                if (!f) return;
                specs.push({ key: f.key, dir: f.def });
                changed();
                if (addBtn.disabled) rowEls[rowEls.length - 1].querySelector('.sort-dir').focus();
            });

            clearBtn?.addEventListener('click', () => {
                specs = DEFAULT.map(s => ({ ...s }));
                changed();
            });

            window.anorakSort = {
                fields: FIELDS,
                get: () => specs.map(s => ({ ...s })),
                isDefault,
                defaultDir: (key) => byKey[key]?.def || 'desc',
                // Column header clicks drive level 1.
                setPrimary: (key, dir) => {
                    if (!byKey[key]) return;
                    assign(0, key, dir);
                    changed();
                },
                subscribe: (fn) => { listeners.add(fn); return () => listeners.delete(fn); },
            };

            render();
        })();

        // Sources: which Lodestarr sources a search asks. The list comes from
        // /api/indexers; the choice is remembered as the set of *unchecked*
        // ids so a newly installed source starts checked. Unchecking hides
        // that source's rows at once; checking one the last search skipped
        // offers "Search again". The results fragment reads the state via
        // window.anorakSources and subscribes to changes.
        (() => {
            const dropdown = document.getElementById('sourcesDropdown');
            const toggle = document.getElementById('sourcesToggle');
            const listEl = document.getElementById('sourcesList');
            const dot = document.getElementById('sourcesDot');
            const summary = document.getElementById('sourcesSummary');
            const input = document.getElementById('indexersInput');
            const note = document.getElementById('sourcesNote');
            const noteText = document.getElementById('sourcesNoteText');
            const research = document.getElementById('sourcesResearch');
            const form = document.querySelector('.search-form');
            const KEY = 'anorak-sources-off';
            if (!dropdown || !toggle || !listEl || !input) return;

            let list = [];
            let off = new Set();
            try { off = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
            let searched = null;   // ids asked by the last search (null = none yet)
            let counts = null;     // id -> rows in the current results
            const listeners = new Set();

            const isChecked = (id) => !off.has(id);
            const checkedIds = () => list.filter(s => isChecked(s.id)).map(s => s.id);
            const allChecked = () => list.every(s => isChecked(s.id));
            const noneChecked = () => list.length > 0 && list.every(s => !isChecked(s.id));
            const nameOf = (id) => (list.find(s => s.id === id) || {}).name || id;

            const save = () => {
                try {
                    // Only remember ids that still exist.
                    const ids = list.length ? [...off].filter(id => list.some(s => s.id === id)) : [...off];
                    if (ids.length) localStorage.setItem(KEY, JSON.stringify(ids));
                    else localStorage.removeItem(KEY);
                } catch (e) {}
            };

            const syncInput = () => {
                input.value = !list.length || allChecked() ? '' : checkedIds().join(',');
            };

            const buildList = () => {
                listEl.innerHTML = '';
                list.forEach(s => {
                    const label = document.createElement('label');
                    label.className = 'source-option';
                    label.dataset.id = s.id;
                    label.innerHTML = '<input type="checkbox"><span class="source-name"></span><span class="source-count"></span>';
                    label.querySelector('input').value = s.id;
                    label.querySelector('.source-name').textContent = s.name;
                    label.title = s.id;
                    listEl.appendChild(label);
                });
            };

            // Update in place so keyboard focus stays on the checkbox.
            const render = () => {
                const n = checkedIds().length;
                listEl.querySelectorAll('.source-option').forEach(label => {
                    const id = label.dataset.id;
                    label.querySelector('input').checked = isChecked(id);
                    const countEl = label.querySelector('.source-count');
                    let text = '';
                    let title = '';
                    if (searched && !searched.has(id)) {
                        text = 'not searched';
                        title = 'Not part of the last search';
                    } else if (counts) {
                        const c = counts.get(id) || 0;
                        text = String(c);
                        title = `${c} result${c === 1 ? '' : 's'} in the last search`;
                    }
                    countEl.textContent = text;
                    countEl.title = title;
                    label.classList.toggle('unchecked', !isChecked(id));
                });
                const partial = list.length > 0 && !allChecked();
                dot.hidden = !partial;
                summary.textContent = partial ? `${n}/${list.length}` : '';
                toggle.title = partial
                    ? `Searching ${n} of ${list.length} sources`
                    : (list.length ? `Searching all ${list.length} sources` : toggle.title);

                const missing = searched ? checkedIds().filter(id => !searched.has(id)) : [];
                if (noneChecked()) {
                    noteText.textContent = 'No sources checked: nothing will be searched.';
                    research.hidden = true;
                    note.hidden = false;
                } else if (missing.length && (document.getElementById('search_term')?.value || '').trim()) {
                    const names = missing.map(nameOf).join(', ');
                    noteText.textContent = `${names} ${missing.length === 1 ? 'was' : 'were'} not part of this search.`;
                    research.hidden = false;
                    note.hidden = false;
                } else {
                    note.hidden = true;
                }
            };

            const changed = () => {
                syncInput();
                save();
                render();
                listeners.forEach(fn => { try { fn(); } catch (err) { console.error(err); } });
            };

            listEl.addEventListener('change', (e) => {
                const cb = e.target;
                if (!(cb instanceof HTMLInputElement)) return;
                if (cb.checked) off.delete(cb.value); else off.add(cb.value);
                changed();
            });
            document.getElementById('sourcesAll')?.addEventListener('click', () => {
                off.clear();
                changed();
            });
            document.getElementById('sourcesNone')?.addEventListener('click', () => {
                list.forEach(s => off.add(s.id));
                changed();
            });
            research?.addEventListener('click', () => {
                if (form && window.htmx) htmx.trigger(form, 'submit');
            });

            // Registered before the Filter/Sort handler below, which skips
            // cancelled requests.
            document.body.addEventListener('htmx:beforeRequest', (e) => {
                if (e.detail?.target?.id !== 'mainContent') return;
                if (noneChecked()) {
                    e.preventDefault();
                    const main = document.getElementById('mainContent');
                    if (main) {
                        if (window.__anorakResultsCleanup) {
                            window.__anorakResultsCleanup();
                            window.__anorakResultsCleanup = null;
                        }
                        main.innerHTML = '<p class="sources-empty">No sources are checked. Open <b>Sources</b> and check at least one.</p>';
                        ['filterToggle', 'sortToggle'].forEach(id => {
                            const b = document.getElementById(id);
                            if (b) b.disabled = true;
                        });
                    }
                    return;
                }
                searched = new Set(list.length ? checkedIds() : []);
                counts = null;
                render();
            });

            window.anorakSources = {
                get available() { return list.length > 0; },
                get list() { return list.slice(); },
                isChecked,
                allChecked,
                noneChecked,
                // Called by the results fragment; null resets.
                setCounts: (map) => { counts = map; render(); },
                subscribe: (fn) => { listeners.add(fn); return () => listeners.delete(fn); },
            };

            fetch('/api/indexers')
                .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
                .then(data => {
                    if (!data || !data.available || !Array.isArray(data.indexers) || !data.indexers.length) {
                        dropdown.hidden = true;
                        return;
                    }
                    list = data.indexers.map(s => ({ id: String(s.id), name: String(s.name || s.id) }));
                    buildList();
                    toggle.disabled = false;
                    syncInput();
                    render();
                    listeners.forEach(fn => { try { fn(); } catch (err) { console.error(err); } });
                })
                .catch(() => { dropdown.hidden = true; });
        })();

        (() => {
            const main = document.querySelector('#mainContent');
            if (!main) return;

            // File list for a result, fetched once when its name is expanded.
            // /api/files reads the .torrent (or asks rqbit to resolve the
            // magnet's metadata without adding it); nothing is downloaded.
            const fmtBytes = (n) => {
                n = Number(n) || 0;
                const units = ['B', 'KB', 'MB', 'GB', 'TB'];
                let i = 0;
                while (n >= 1024 && i < units.length - 1) { n /= 1024; i += 1; }
                return `${i === 0 ? n : n.toFixed(n >= 100 ? 0 : (n >= 10 ? 1 : 2))} ${units[i]}`;
            };
            const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

            const renderFiles = (box, info) => {
                const parts = [`<b>${plural(info.count, 'file')}</b>, ${fmtBytes(info.total)}`];
                if (info.count > 1) {
                    if (info.main_count === 1 && info.largest) {
                        parts.push(`main file ${fmtBytes(info.largest.size)}`);
                    } else if (info.main_count > 1) {
                        parts.push(`${plural(info.main_count, 'main file')} ${fmtBytes(info.main_total)}` +
                            (info.largest ? ` (largest ${fmtBytes(info.largest.size)})` : ''));
                    }
                    if (info.extras_count > 0) {
                        parts.push(`<span class="muted">${info.extras_count} small extra${info.extras_count === 1 ? '' : 's'} ${fmtBytes(info.extras_total)}</span>`);
                    }
                }
                let html = `<div class="file-summary">${parts.join(' · ')}</div>`;
                const files = Array.isArray(info.files) ? info.files : [];
                if (files.length > 1) {
                    const more = info.count > files.length ? `<li class="muted">…and ${info.count - files.length} more</li>` : '';
                    html += `<details class="file-list"><summary>Show files</summary><ol>${files.map(f =>
                        `<li class="${f.extra ? 'extra' : ''}"><span class="file-path">${esc(f.path)}</span><span class="file-size">${fmtBytes(f.size)}</span></li>`).join('')}${more}</ol></details>`;
                } else if (files.length === 1) {
                    html += `<div class="file-single muted">${esc(files[0].path)}</div>`;
                }
                box.innerHTML = html;
            };

            const loadFiles = (cell) => {
                const row = cell.closest('tr');
                if (!row || cell.querySelector('.file-info')) return;
                const box = document.createElement('div');
                box.className = 'file-info';
                cell.appendChild(box);
                const magnet = row.dataset.magnet || '';
                const torrent = row.dataset.torrent || '';
                if (!magnet && !torrent) {
                    box.innerHTML = '<span class="muted">File list unavailable: this result has no magnet or .torrent link.</span>';
                    return;
                }
                box.innerHTML = '<span class="muted">Loading file list…</span>';
                const params = new URLSearchParams({ magnet, torrent, indexer: (row.dataset.sources || '').split(' ')[0] || '' });
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 50000);
                fetch(`/api/files?${params}`, { signal: ctrl.signal })
                    .then(async r => {
                        const data = await r.json().catch(() => ({}));
                        if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
                        return data;
                    })
                    .then(info => { if (box.isConnected) renderFiles(box, info); })
                    .catch(err => {
                        if (!box.isConnected) return;
                        const msg = err.name === 'AbortError' ? 'timed out (no peers answered)' : err.message;
                        box.innerHTML = `<span class="muted">File list unavailable: ${esc(msg)}</span> <button type="button" class="link-btn file-retry">Retry</button>`;
                    })
                    .finally(() => clearTimeout(timer));
            };

            let expandedCell = null;
            document.body.addEventListener('click', (event) => {
                const target = event.target instanceof Element ? event.target : event.target?.parentElement;
                const cell = target?.closest('#mainContent td.name');
                if (!cell || !main.contains(cell)) return;

                // Clicks inside the file list (details, text selection) keep
                // the row open; Retry refetches.
                const info = target.closest('.file-info');
                if (info) {
                    if (target.closest('.file-retry')) {
                        info.remove();
                        loadFiles(cell);
                    }
                    return;
                }

                if (expandedCell && expandedCell !== cell) {
                    expandedCell.classList.remove('expanded');
                }

                if (cell.classList.toggle('expanded')) {
                    expandedCell = cell;
                    loadFiles(cell);
                } else {
                    expandedCell = null;
                }
            });

            const dropdowns = ['sources', 'filter', 'sort'].map(name => ({
                name,
                root: document.getElementById(`${name}Dropdown`),
                toggle: document.getElementById(`${name}Toggle`),
                panel: document.getElementById(`${name}Panel`),
            })).filter(d => d.root && d.toggle && d.panel);
            const byName = (name) => dropdowns.find(d => d.name === name);
            const filterToggle = byName('filter')?.toggle;
            const sortToggle = byName('sort')?.toggle;

            const closeDropdowns = () => {
                dropdowns.forEach(d => {
                    d.panel.hidden = true;
                    d.toggle.setAttribute('aria-expanded', 'false');
                    d.root.classList.remove('open');
                });
            };

            const toggleDropdown = (name) => {
                const d = byName(name);
                const opening = d && d.panel.hidden;
                closeDropdowns();
                if (opening) {
                    d.panel.hidden = false;
                    d.toggle.setAttribute('aria-expanded', 'true');
                    d.root.classList.add('open');
                }
            };

            // Start closed regardless of markup/cached state, and let the
            // results fragment (query.html) close them after each swap.
            closeDropdowns();
            window.__anorakCloseDropdowns = closeDropdowns;
            window.addEventListener('pageshow', closeDropdowns);

            dropdowns.forEach(d => {
                d.toggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (d.toggle.disabled) return;
                    toggleDropdown(d.name);
                });
            });

            document.addEventListener('click', (e) => {
                // Use the path captured at dispatch: a sort control may have
                // removed itself from the DOM (e.g. a row's remove button).
                const path = typeof e.composedPath === 'function' ? e.composedPath() : [];
                if (path.some(n => n instanceof Element && n.classList.contains('search-dropdown'))) return;
                if (e.target instanceof Element && e.target.closest('.search-dropdown')) return;
                closeDropdowns();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeDropdowns();
            });

            // Disable Filter/Sort while a new search is in flight
            document.body.addEventListener('htmx:beforeRequest', (e) => {
                if (e.defaultPrevented) return;
                if (e.detail?.target?.id === 'mainContent') {
                    closeDropdowns();
                    if (filterToggle) filterToggle.disabled = true;
                    if (sortToggle) sortToggle.disabled = true;
                }
            });

            // New results must never arrive with a panel open
            document.body.addEventListener('htmx:afterSwap', (e) => {
                if (e.detail?.target?.id === 'mainContent') closeDropdowns();
            });
        })();
    </script>
</body>

</html>
